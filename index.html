<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>ASCII</title>
  <style>
    :root { color-scheme: dark; background: #000; color: #fff; }
    body { margin: 0; }
    main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px 16px; box-sizing: border-box; }
    pre { margin: 0; font-family: "Courier New", monospace; font-size: min(1.35vw, .82dvh, 8px); line-height: .85; white-space: pre; }
    nav { display: flex; align-items: center; gap: 8px; color: #777; font: 12px "Courier New", monospace; }
    nav button { min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #999; font: inherit; cursor: pointer; }
    nav button[aria-pressed="true"], nav button:hover { color: #fff; }
    nav button:focus-visible { outline: 1px dotted #fff; outline-offset: 2px; }
    [hidden] { display: none !important; }
    .panel { width: min(100%, 420px); text-align: center; font: 12px/1.5 "Courier New", monospace; color: #aaa; overflow-wrap: anywhere; }
    .panel p { margin: 0 0 6px; white-space: pre-line; }
    .panel a { display: block; color: #aaa; text-decoration: none; min-height: 28px; line-height: 28px; }
    @media (pointer: coarse) { .panel a { min-height: 44px; line-height: 44px; } }
    .panel a:hover, .panel a:focus-visible { color: #fff; }
    #nickname { color: #fff; }
    .scrambling { position: relative; }
    .panel .scrambling, .panel .scrambling:hover, #nickname.scrambling { color: transparent; }
    .scrambling::after { content: attr(data-scramble); position: absolute; inset: 0; color: #aaa; white-space: inherit; pointer-events: none; }
    #nickname.scrambling::after { color: #fff; }
    #trail { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .mote { position: absolute; color: #aaa; font: 12px/12px "Courier New", monospace; white-space: pre; transform: translate(-50%, -50%); }
    @media (prefers-reduced-motion: reduce) { #trail { display: none; } }
  </style>
</head>
<body>
  <main aria-label="ASCII-девочка: платье колышется от ветра">
    <pre id="signal" aria-hidden="true"></pre>
    <nav aria-label="Разделы">
      <button type="button" aria-pressed="false" aria-controls="about">about</button>
      <span aria-hidden="true">/</span>
      <button type="button" aria-pressed="true" aria-controls="contacts">contacts</button>
      <span aria-hidden="true">/</span>
      <button type="button" aria-pressed="false" aria-controls="activity">activity</button>
    </nav>
    <section class="panel" id="about" aria-label="about" hidden>
      <p id="nickname">iwakura</p>
      <p id="description"></p>
    </section>
    <section class="panel" id="contacts" aria-label="contacts">
      <a id="discord-contact" href="https://discord.com/users/1420459390665883790" target="_blank" rel="noopener noreferrer">discord / @hyprlandenjoyer</a>
      <a href="https://t.me/drainingsad" target="_blank" rel="noopener noreferrer">telegram / @drainingsad</a>
      <a href="https://github.com/drainingsad" target="_blank" rel="noopener noreferrer">github / @drainingsad</a>
    </section>
    <section class="panel" id="activity" aria-label="activity" hidden>
      <p id="presence" aria-live="polite">подключаюсь к Discord…</p>
    </section>
  </main>
  <div id="trail" aria-hidden="true"></div>
  <audio id="rain" src="rain.ogg" loop preload="auto"></audio>
  <audio id="music" src="music.m4a" loop preload="auto"></audio>
  <script>
    const rain = document.getElementById('rain');
    rain.volume = .20;
    const music = document.getElementById('music');
    music.volume = .20;
    let startingAudio = false;
    async function startAudio() {
      if (startingAudio || (!rain.paused && !music.paused)) return;
      startingAudio = true;
      try {
        await Promise.all([rain.play(), music.play()]);
        document.removeEventListener('pointerdown', startAudio);
        document.removeEventListener('keydown', startAudio);
      } catch {} finally { startingAudio = false; }
    }
    document.addEventListener('pointerdown', startAudio);
    document.addEventListener('keydown', startAudio);
    startAudio();
    const sections = document.querySelectorAll('nav button');
    let cancelTextAnimation = () => {};

    function animatePanel(panel) {
      cancelTextAnimation();
      if (motion.matches) return;
      const elements = Array.from(panel.querySelectorAll('p, a'));
      let request, start;
      function finish() {
        cancelAnimationFrame(request);
        for (const element of elements) {
          element.classList.remove('scrambling');
          element.removeAttribute('data-scramble');
        }
      }
      cancelTextAnimation = finish;
      function tick(time) {
        start ??= time;
        const progress = Math.min(1, (time - start) / 360);
        if (progress === 1 || motion.matches || panel.hidden) { finish(); return; }
        for (const element of elements) {
          const text = Array.from(element.textContent);
          element.setAttribute('data-scramble', text.map((char, index) => {
            if (/\s/.test(char) || index < progress * text.length) return char;
            return '0Oo:.+*'[Math.floor(time / 45 + index * 3) % 7];
          }).join(''));
          element.classList.add('scrambling');
        }
        request = requestAnimationFrame(tick);
      }
      request = requestAnimationFrame(tick);
    }

    for (const button of sections) {
      button.addEventListener('click', () => {
        for (const section of sections) {
          const selected = section === button;
          section.setAttribute('aria-pressed', String(selected));
          document.getElementById(section.getAttribute('aria-controls')).hidden = !selected;
        }
        if (button.getAttribute('aria-controls') === 'activity') { connectPresence(); updatePresence(); }
        animatePanel(document.getElementById(button.getAttribute('aria-controls')));
      });
    }
    const signal = document.getElementById('signal');
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    let frames, request, start;
    const ripples = [];
    const trail = document.getElementById('trail');
    let lastPointer = -Infinity, lastDraw = -Infinity;

    function outsideRing(clientX, clientY) {
      const mote = document.createElement('span');
      mote.className = 'mote';
      mote.style.left = `${clientX}px`;
      mote.style.top = `${clientY}px`;
      trail.append(mote);
      let step = 0;
      function draw() {
        const bounds = signal.getBoundingClientRect();
        const progress = step / 15;
        const grid = Array.from({ length: 13 }, () => Array(21).fill(' '));
        const symbol = '0Oo:.'[Math.min(4, Math.floor(progress * 5))];
        const radius = 1 + progress * 8;
        for (let i = 0; i < 20; i++) {
          const angle = i * Math.PI / 10 + progress * 1.2;
          const x = Math.round(10 + Math.cos(angle) * radius);
          const y = Math.round(6 + Math.sin(angle) * radius * .6);
          const screenX = clientX + (x - 10) * 7.2;
          const screenY = clientY + (y - 6) * 12;
          if (screenX < bounds.left || screenX >= bounds.right || screenY < bounds.top || screenY >= bounds.bottom) grid[y][x] = symbol;
        }
        mote.textContent = grid.map(row => row.join('')).join('\n');
        mote.style.opacity = String((1 - progress) * .8);
      }
      draw();
      const timer = setInterval(() => {
        step++;
        if (step >= 15 || motion.matches || document.hidden) {
          clearInterval(timer);
          mote.remove();
        } else draw();
      }, 80);
    }

    document.addEventListener('pointermove', event => {
      if (!frames || motion.matches || event.pointerType === 'touch') return;
      const now = performance.now();
      if (now - lastPointer < 50) return;
      const bounds = signal.getBoundingClientRect();
      lastPointer = now;
      outsideRing(event.clientX, event.clientY);
      ripples.push({
        x: (event.clientX - bounds.left) / bounds.width * 112,
        y: (event.clientY - bounds.top) / bounds.height * 112,
        aspect: bounds.height / bounds.width,
        time: now
      });
      if (ripples.length > 24) ripples.shift();
    });

    function renderFrame(base, time) {
      while (ripples.length && time - ripples[0].time >= 1200) ripples.shift();
      if (!ripples.length) return base;
      const grid = base.split('\n').map(row => row.split(''));
      for (const ripple of ripples) {
        const progress = Math.max(0, (time - ripple.time) / 1200);
        const radius = 1 + progress * 18;
        const symbol = '0Oo:.'[Math.min(4, Math.floor(progress * 5))];
        const reach = radius + 1.5;
        for (let y = Math.max(0, Math.floor(ripple.y - reach / ripple.aspect)); y <= Math.min(111, Math.ceil(ripple.y + reach / ripple.aspect)); y++) {
          for (let x = Math.max(0, Math.floor(ripple.x - reach)); x <= Math.min(111, Math.ceil(ripple.x + reach)); x++) {
            const distance = Math.hypot(x - ripple.x, (y - ripple.y) * ripple.aspect);
            const fade = ((x * 13 + y * 7) % 17) / 17;
            if (Math.abs(distance - radius) < 1.2 && fade < Math.min(1, (1 - progress) * 3)) grid[y][x] = symbol;
          }
        }
      }
      return grid.map(row => row.join('')).join('\n');
    }

    function animate(time) {
      start ??= time;
      if (time - lastDraw >= 40) {
        const index = Math.floor((time - start) * 15 / 1000) % frames.length;
        const content = renderFrame(frames[index], time);
        if (signal.textContent !== content) signal.textContent = content;
        lastDraw = time;
      }
      request = requestAnimationFrame(animate);
    }

    function resume() {
      cancelAnimationFrame(request);
      if (!frames) return;
      start = undefined;
      lastDraw = -Infinity;
      ripples.length = 0;
      signal.textContent = frames[0];
      if (!motion.matches && !document.hidden) request = requestAnimationFrame(animate);
    }

    motion.addEventListener('change', resume);
    document.addEventListener('visibilitychange', resume);
    fetch('frames.json').then(response => {
      if (!response.ok) throw new Error('Frames unavailable');
      return response.json();
    }).then(data => { frames = data; resume(); }).catch(() => {
      signal.textContent = '';
    });

    const profile={nickname:'iwakura',name:'',description:'пытаюсь изучить прогинг.\nнемножко знаю терминал и пайтон.\nстрадаю хуйней.\n\n еще у меня 2к часов в доте.\nиз за этого я так и не научился прогать',discordId:'1420459390665883790',discordUsername:'hyprlandenjoyer',telegramUsername:'drainingsad'};
    const nicknameAnswer = document.getElementById('nickname');
    const presenceAnswer = document.getElementById('presence');
    const discordContact = document.getElementById('discord-contact');
    document.getElementById('description').textContent = profile.description;
    let presenceTimer, presenceSocket, heartbeat;
    let presenceLive = false, presencePending = false;
function discordName(user){
 return [user?.display_name,user?.global_name,profile.nickname].find(value=>typeof value==='string'&&value.trim())?.trim()||profile.nickname;
}
function describeDiscord(data){
 if(data.discord_status==='offline')return 'сейчас не в сети.';
 if(data.listening_to_spotify&&data.spotify?.song)return 'слушаю spotify ('+data.spotify.song+(data.spotify.artist?' — '+data.spotify.artist:'')+')';
 const activity=data.activities?.find(item=>[0,1,2,3,5].includes(item.type)&&typeof item.name==='string');
 if(activity){
  const name=activity.name.trim();
  const details=typeof activity.details==='string'?activity.details.trim():'';
  const state=typeof activity.state==='string'?activity.state.trim():'';
  const source=[name,state,activity.details_url,activity.assets?.large_url].filter(value=>typeof value==='string').join(' ');
  if(/visual studio code|\bvs\s?code\b/i.test(name))return 'пытаюсь что-то накодить вской';
  if(/intellij|\bidea\b/i.test(name))return 'пытаюсь что-то накодить интелкой';
  if(activity.type===2||/soundcloud|spotify|apple music|yandex music|яндекс музыка|deezer|tidal|^music$/i.test(name)){
   const platform=/soundcloud/i.test(source)?'ск':/^music$/i.test(name)?'музыку':name;
   const track=[details,state].filter(value=>value&&value.toLowerCase()!==name.toLowerCase()&&!/^(firefox|chrome|edge|opera|soundcloud|spotify)$/i.test(value)).join(' — ');
   return 'слушаю '+platform+(track?' ('+track+')':'');
  }
  if(activity.type===3||/youtube|netflix|twitch|vimeo|кинопоиск/i.test(name))return 'смотрю видео'+(details?'\n'+details:'');
  const verbs={0:'играю',1:'в эфире',5:'соревнуюсь'};
  return verbs[activity.type]+': '+name+(details?'\n'+details:'');
 }
 const status={online:'сейчас в сети.',idle:'сейчас отошёл.',dnd:'сейчас не беспокоить.'}[data.discord_status];
 return status?status+'\nDiscord не передаёт текущую активность.':'Discord не передаёт текущую активность.';
}
function applyPresence(data){
 if(nicknameAnswer)nicknameAnswer.textContent=discordName(data.discord_user);
 if(discordContact&&typeof data.discord_user?.username==='string'&&data.discord_user.username.trim())discordContact.textContent='discord / @'+data.discord_user.username.trim();
 if(presenceAnswer)presenceAnswer.textContent=describeDiscord(data);
}
function connectPresence(){
 if(!('WebSocket' in window)||presenceSocket||document.hidden||!presenceAnswer)return;
 try{
  const socket=new WebSocket('wss://api.lanyard.rest/socket');presenceSocket=socket;
  socket.onmessage=event=>{
   try{
    const message=JSON.parse(event.data);
    if(message.op===1){
     socket.send(JSON.stringify({op:2,d:{subscribe_to_id:profile.discordId}}));
     clearInterval(heartbeat);
     heartbeat=setInterval(()=>{if(socket.readyState===1)socket.send(JSON.stringify({op:3}))},message.d.heartbeat_interval);
    }else if(message.op===0&&['INIT_STATE','PRESENCE_UPDATE'].includes(message.t)&&message.d){
     presenceLive=true;clearTimeout(presenceTimer);applyPresence(message.d);
    }
   }catch{console.warn('Discord: invalid presence message')}
  };
  socket.onerror=()=>socket.close();
  socket.onclose=()=>{presenceSocket=null;presenceLive=false;clearInterval(heartbeat);updatePresence()};
 }catch{presenceSocket=null}
}
async function updatePresence(){
 clearTimeout(presenceTimer);
 if(!/^\d{17,20}$/.test(profile.discordId)||document.hidden||!presenceAnswer||presencePending||presenceLive)return;
 presencePending=true;
 try{
  const response=await fetch('https://api.lanyard.rest/v1/users/'+profile.discordId,{cache:'no-store',signal:AbortSignal.timeout(30000)});
  if(!response.ok)throw new Error('Presence unavailable');
  const result=await response.json();
  if(!result.success||!result.data)throw new Error('Presence unavailable');
  if(!presenceLive)applyPresence(result.data);
 }catch(error){
  if(!presenceLive)presenceAnswer.textContent='не удалось подключиться к Discord.';
  console.warn('Discord presence connection failed:',error);
 }finally{presencePending=false}
 if(!presenceLive&&!document.hidden)presenceTimer=setTimeout(()=>{connectPresence();updatePresence()},30000);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(presenceTimer);presenceSocket?.close()}else{connectPresence();updatePresence()}});
window.addEventListener('pagehide',()=>{clearTimeout(presenceTimer);clearInterval(heartbeat);presenceSocket?.close()});
  </script>
</body>
</html>
